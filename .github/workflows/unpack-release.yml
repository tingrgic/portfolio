name: Publish packaged portfolio

on:
  push:
    branches: [main]
    paths: [portfolio-release.tar.gz]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with verified release
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name portfolio-release.tar.gz -exec rm -rf -- {} +
          tar -xzf portfolio-release.tar.gz
          rm portfolio-release.tar.gz
          rm .github/workflows/unpack-release.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix GitHub Pages desktop animation assets"
          git push
